name: Email Director Cron

# External scheduler for /api/cron/email-director.
# Vercel's Hobby plan caps server-side crons at 1/day; GitHub Actions has no
# such limit, so the multi-per-day cadence lives here instead of vercel.json.
# Vercel keeps a once/day baseline as a safety net (see vercel.json).

on:
  # schedule disabled — replaced by enrollment-based sequence runner (sequence-segmenter-cron.yml)
  # Uncomment to re-enable auto-blast (not recommended):
  #   - cron: "0 13 * * 1-5"
  #   - cron: "0 16 * * 1-5"
  #   - cron: "0 19 * * 1-5"
  workflow_dispatch:  # lets Matt trigger manually from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire /api/cron/email-director
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — calling without auth"
            AUTH_ARGS=""
          else
            AUTH_ARGS="-H \"Authorization: Bearer $CRON_SECRET\""
          fi
          http_code=$(eval curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            $AUTH_ARGS \
            "https://mission.srtagency.com/api/cron/email-director")
          echo "http_code=$http_code"
          echo "--- response ---"
          cat response.txt
          echo ""
          if [ "$http_code" != "200" ]; then
            echo "::error::Non-200 response from email-director cron (status=$http_code)"
            exit 1
          fi
