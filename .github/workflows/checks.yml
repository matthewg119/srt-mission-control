name: Checks

# The typecheck and the probes that need nothing but the source.
#
# There was no CI before this. Every check below was run by hand before a push, and a check that
# depends on somebody remembering to run it is a check that eventually does not run.
#
# NO SECRETS, ON PURPOSE. Every script here reads source files or pure functions and was proven to
# pass on a clean checkout with no .env file present (2026-09-15). src/lib/db.ts falls back to a
# placeholder client instead of throwing, so an import that reaches it is harmless. A probe that
# needs the database or a model call does NOT belong in this file: it would either fail on every run
# or, worse, pass vacuously against a placeholder URL. Those stay manual (see the build doc's
# verification list).
#
# NOT `bun run build`. Vercel builds every push already, and a Next build here would need the
# production env to mean anything.
#
# Not wired into Code Guardian yet. Its own header warns that a workflow failing on every run turns
# the guardian into a spam source, so add "Checks" to its workflow_run list once this has been green
# for a while.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # package.json packageManager. Keep the two in step.
          bun-version: "1.3.10"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      # --no-env-file so a stray .env can never make a check pass here that would fail for real.
      # Each script exits 1 on any failed check.
      - name: Onboarding artifacts
        run: bun --no-env-file run scripts/test-onboarding-artifacts.ts

      - name: Vocabulary probe (the audience cutover)
        run: bun --no-env-file run scripts/_probe-vocabulary.ts

      - name: Presence URL probe
        run: bun --no-env-file run scripts/_probe-presence-url.ts

      - name: Step verify probe
        run: bun --no-env-file run scripts/_probe-step-verify.ts
      # ‼️ THE ANTI-GATING RULE WAS A COMMENT UNTIL 2026-09-24. _probe-review-gating.ts has
      # existed since the stars were added and was referenced in three docs, but it was in no
      # workflow and no package script, so nothing ran it. It needs no secrets and no database,
      # which is exactly why there was no reason for it to be missing.
      - name: Review gating probe (the rating must not route, and neither may a Yes)
        run: bun --no-env-file run scripts/_probe-review-gating.ts

      - name: Virtual Agent grammar probe (one agent, two surfaces)
        run: bun --no-env-file run scripts/_probe-virtual-agent-grammar.ts

      # ‼️ THE IN-CLINIC REFERRAL (v5, 2026-10-05) PUT A THIRD PARTY'S PHONE NUMBER INTO THE
      # CUSTOMER-FACING WALK, which is the first time that has ever been true. Two rules that only
      # a probe can hold: SRT is not the sender (the module returns an href and has no network
      # call in it), and a friend's contact lives in exactly one table. The FTC-shaped half, that
      # the offer is never consideration for a review, is asserted in the gating probe above.
      - name: Referral invite probe (she sends it, and it expires)
        run: bun --no-env-file run scripts/_probe-referral-invite.ts

      # ‼️ THE FORK AT THE END OF /cards IS EXCLUSIVE AND ONLY A PROBE CAN HOLD THAT. Booking the
      # setup call must not also pre-set the review platform, or the call opens by undoing the
      # clinic's guesses. It also holds the rule that this funnel sells nothing (it is reached
      # from an email that already promised a free batch of cards) and that nothing in it is
      # labelled HIPAA, which is a reason to talk, not a lever.
      - name: Cards funnel probe (one fork, two ways out)
        run: bun --no-env-file run scripts/_probe-cards-funnel.ts

      # ‼️ /cards/p LETS A CLINIC PICK A CARD DESIGN, AND ONLY A PROBE CAN STOP THAT BECOMING A
      # CHOICE OF WORDING. "VISUAL THEME PER CLIENT. COPY IDENTICAL FOR EVERY CLIENT. FOREVER" is
      # the rule the whole AI Referral Engine rests on, and a palette config that quietly grew a
      # headline field would break it with nothing failing. This also holds that the preview and
      # the printed PDF read one copy of the card's words, that no screen draws a star or offers
      # anything for a review, and that the closing line says a PDF is coming "shortly" rather
      # than claiming one was sent, because nothing in that lane sends one yet.
      - name: Card preview probe (a design is a palette, not a wording)
        run: bun --no-env-file run scripts/_probe-card-preview.ts

      # The launcher was unclickable for nine days and no check in this file noticed, because the
      # only thing that could have noticed was somebody tapping it. See the probe's own header for
      # why it asserts a shape rather than simulating a tap.
      - name: Launcher gesture probe (a tap opens it, a drag does not)
        run: bun --no-env-file run scripts/_probe-launcher-gestures.ts
      # Importing referral-script.ts is itself the copy-guard check, and section 3 is the one that
      # matters: a scripted walk is where inventing "Tuesday at 10" is easiest and worst, because the
      # model is not in that path and nothing downstream would catch it.
      - name: Referral lane probe (scripted, and the times are the calendar's)
        run: bun --no-env-file run scripts/_probe-referral-lane.ts

      # A link in an email is the least controlled thing we produce. These checks are about what the
      # resume link CANNOT do: it is not the session's write bearer, it expires in three days, and it
      # cannot open another tenant's conversation.
      - name: Referral resume probe (a grant, not a bearer)
        run: bun --no-env-file run scripts/_probe-referral-resume.ts
      # The pivot is a sales pitch that cites a measurement about somebody's own business. A made-up
      # number there is a false claim about a real company, in writing, so this one has teeth.
      - name: Report pivot probe (it cites the report or cites nothing)
        run: bun --no-env-file run scripts/_probe-report-pivot.ts
      # Section 2 is the one that matters: Findable/Familiar/Fresh exist nowhere in the data, so a wait
      # card implying a score per pillar promises a shape the report contradicts a minute later.
      - name: Audit wait probe (it teaches, and claims nothing)
        run: bun --no-env-file run scripts/_probe-audit-wait.ts
      # Section 2 is the one with teeth: it derives the ingestLead census from the tree, so a twelfth
      # caller cannot be added without either passing a source page or saying why there is none.
      - name: Lead card probe (every lead source names its page)
        run: bun --no-env-file run scripts/_probe-lead-card.ts
      # ‼️ THE SCRAPER LANE'S ONLY AUTOMATIC GUARD. The lane leans on four lists the
      # compiler cannot check, because each is a plain array rather than a `Record<Workflow, ...>`:
      # PICK and KEYCAPS in lane.ts, IN_FLIGHT in report.ts, ACTIVE_STATUSES in store.ts. A missing
      # entry in any of them is a silent misroute, and the worst of them spends money per row. This
      # probe reads them out of the source for exactly that reason, and until now nothing ran it.
      #
      # Offline by construction: the three real MX lookups sit behind --mx, so the default run
      # touches no network, no database and no Slack.
      - name: Scraper lane probe (the dispatch the compiler cannot check)
        run: bun --no-env-file run scripts/_probe-scraper.ts

      # ‼️ THE ONE THAT STOPS A HOLE OPENING IN THE MAP. The national crawl decides WHICH CIRCLES
      # EXIST, so a mistake in its geometry does not produce a bad number, it produces a patch of the
      # country no pull ever looks at, and an unfetched business leaves nothing behind to notice. The
      # load-bearing check samples each parent's box and requires every point to land in one of its four
      # children: the obvious "child radius is half the parent's" rule fails it by 1.3 to 3.3 km at
      # every level. Offline by construction, no key and no spend.
      - name: National coverage cells (the geometry, and that nowhere is uncovered)
        run: bun --no-env-file run scripts/_probe-cells.ts

      # ‼️ THE ONE THAT DECIDES WHOSE NAME GOES IN A GREETING. A wrong owner is not a missing lead:
      # it is permuted into six addresses, verified, and mailed to a real stranger addressed as
      # somebody else. The load-bearing rail is the eight-character containment floor, without which
      # "spa" matches every clinic in America. Offline, no key, no network.
      - name: NPPES owner lookup (that it cannot name the wrong clinic)
        run: bun --no-env-file run scripts/_probe-nppes.ts

      # ‼️ THE ONE THAT STOPS DEAD WIRES COMING BACK. It reads docs/*.sql and src/ off disk and
      # touches no database, which is what makes it gateable: its whole value is that it runs without
      # anybody remembering to run it. It carries a board-wide baseline count that may only go DOWN.
      - name: Dead wires (write-only columns, and outputs with no consumer)
        run: bun --no-env-file run scripts/_probe-dead-wires.ts

      # ‼️ THE DRIFT CHECK. It shells out to `_step-wiring.ts --check`, so this is what stops
      # docs/STEP-WIRING.md and docs/ONBOARDING-MAP.md going stale on main. Without it the memory layer
      # is a document that was correct on the day it was written, and the two docs are the ones the
      # board's own instructions say to read before touching a step. Offline: no database, no env, no
      # network, and the shell-out is `bun run` rather than `bunx tsx` precisely so it fetches nothing.
      - name: Step re-run grammar, and the generated docs still describe the board
        run: bun --no-env-file run scripts/_probe-step-rerun.ts

      # ‼️ THE TWO CHECKS GUARDING THE ENTIRE LAUNCH LANE, AND NEITHER WAS IN THIS FILE. Both
      # have existed since the lane did, both are offline by construction, and both were run only
      # when somebody remembered to. That is the exact failure this workflow's own header is about.
      # The isolation one is the load-bearing half: the whole value of a second lane is that
      # editing one cannot change the other, and no type defends that property.
      - name: Launch lane isolation (the Slack engine stays out of it)
        run: bun --no-env-file run scripts/_probe-launch-isolation.ts

      - name: Launch lane page run (the stage gates, and the rails inside publishPage)
        run: bun --no-env-file run scripts/_probe-launch-pages.ts

      # The per-page walk's grammar runs in a thread that also takes dictation, research pastes and
      # call notes, so a verb one character too loose files somebody's sentence as a decision.
      - name: Page walk (a page's own stage, and no bare digit is a command)
        run: bun --no-env-file run scripts/_probe-page-walk.ts

      # ‼️ FOUR ARTIFACTS, FOUR LENGTH CONTRACTS, AND THE REGRESSION IS THEM CONVERGING. A reel
      # title is 8 words or fewer, an ad hook is 12 to 45 words, a page H1 is a 4 to 12 word query
      # core and a title tag is 50 to 60 CHARACTERS. They reach prompts through shared blocks, and
      # in one prompt the shortest rule silently wins every run, which is why each has its own
      # engine constant and why the aeo and seo probes assert the ABSENCE of each other's band.
      #
      # _probe-headline-first.ts was in neither this file nor package.json until 2026-10-08, so
      # nothing ran it. It is offline by construction and it guards the pre-call lane's command
      # grammar, which the three-format change reaches.
      - name: Headline probes
        run: |
          bun --no-env-file run scripts/_probe-aeo-headlines.ts
          bun --no-env-file run scripts/_probe-seo-titles.ts
          bun --no-env-file run scripts/_probe-dr-headlines.ts
          bun --no-env-file run scripts/_probe-headline-page.ts
          bun --no-env-file run scripts/_probe-headline-first.ts
          bun --no-env-file run scripts/_probe-headline-brief.ts
