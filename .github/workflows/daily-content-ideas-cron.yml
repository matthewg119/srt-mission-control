name: Daily Content Ideas Cron

# External scheduler for /api/cron/daily-content-ideas (once per weekday).
# Vercel Hobby caps crons at 1/day — GitHub Actions is the primary trigger.

on:
  # Scheduled trigger disabled — content idea/hook cards paused (2026-06-02).
  # Re-enable by uncommenting the schedule below.
  # schedule:
  #   # 9am Eastern on weekdays (13:00 UTC during EDT).
  #   - cron: "0 13 * * 1-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire /api/cron/daily-content-ideas
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — calling without auth"
            AUTH_ARGS=""
          else
            AUTH_ARGS="-H \"Authorization: Bearer $CRON_SECRET\""
          fi
          http_code=$(eval curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            $AUTH_ARGS \
            "https://mission.srtagency.com/api/cron/daily-content-ideas")
          echo "http_code=$http_code"
          echo "--- response ---"
          cat response.txt
          echo ""
          if [ "$http_code" != "200" ]; then
            echo "::error::Non-200 response from daily-content-ideas cron (status=$http_code)"
            exit 1
          fi
