name: AI Guardian Cron

# External scheduler for /api/cron/ai-guardian (every 4 hours).
# Vercel Hobby caps crons at 1/day — GitHub Actions has no such limit.

on:
  schedule:
    # Every 4 hours on the hour.
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire /api/cron/ai-guardian
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret not set"
            exit 1
          fi
          http_code=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://mission.srtagency.com/api/cron/ai-guardian")
          echo "http_code=$http_code"
          echo "--- response ---"
          cat response.txt
          echo ""
          if [ "$http_code" != "200" ]; then
            echo "::error::Non-200 response from ai-guardian cron"
            exit 1
          fi
