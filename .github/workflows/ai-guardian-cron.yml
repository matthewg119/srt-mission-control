name: AI Guardian Cron

# External scheduler for /api/cron/ai-guardian (every 4 hours).
# Vercel Hobby caps crons at 1/day — GitHub Actions has no such limit.

on:
  schedule:
    # Every 4 hours on the hour.
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire /api/cron/ai-guardian
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Build auth header — warn but continue if secret not set (route allows
          # unauthenticated access when CRON_SECRET is also unset on Vercel).
          # TO FIX: add CRON_SECRET to GitHub repo → Settings → Secrets → Actions.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — calling without auth"
            AUTH_ARGS=""
          else
            AUTH_ARGS="-H \"Authorization: Bearer $CRON_SECRET\""
          fi
          http_code=$(eval curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            $AUTH_ARGS \
            "https://mission.srtagency.com/api/cron/ai-guardian")
          echo "http_code=$http_code"
          echo "--- response ---"
          cat response.txt
          echo ""
          if [ "$http_code" != "200" ]; then
            echo "::error::Non-200 response from ai-guardian cron (status=$http_code)"
            exit 1
          fi
